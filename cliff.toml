# git-cliff configuration (https://git-cliff.org). Generates CHANGELOG.md and
# the release notes from conventional commits, in the format the 1.x
# changelog used (commit-and-tag-version): features, bug fixes, performance,
# runtime dependency bumps and breaking changes; other chore/ci/docs/test/
# refactor commits are left out.
#
# The release workflow generates only the new section and inserts it below
# the header of CHANGELOG.md, so the 1.x history (which git-cliff can't
# regenerate exactly) stays untouched. Preview the next release notes with:
#
#   git cliff --unreleased --tag v2.1.0 --strip all

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file. Generated by [git-cliff](https://git-cliff.org) from [conventional commits](https://www.conventionalcommits.org/).

"""
body = """
{%- set repo = "https://github.com/joaoopereira/simple-rtsp-recorder" -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({% if previous.version %}{{ repo }}/compare/{{ previous.version }}...{{ version }}{% else %}{{ repo }}/releases/tag/{{ version }}{% endif %}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## [Unreleased]
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}

### ⚠ BREAKING CHANGES

{% for commit in breaking -%}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.breaking_description | replace(from="\n", to=" ") }}
{% endfor -%}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits -%}
* {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
# Keep breaking changes even when their type (e.g. chore!) is otherwise skipped.
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
# The HTML comments only fix the section order; they are stripped on output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
  # Runtime dependency bumps (Dependabot) reach the PC, so list them; skip
  # the merge commits that bring them in, which repeat the same subject.
  { message = "^chore\\(deps\\): merge ", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 3 -->Dependencies" },
  { message = ".*", skip = true },
]
