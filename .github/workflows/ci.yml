name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (used by recorder tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet (linux + windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build Windows executable
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o simple-rtsp-recorder.exe .

      - name: Check web UI syntax
        run: node --check web/app.js

      # The release bundles ffmpeg.exe from BtbN/FFmpeg-Builds; catch a
      # missing asset here instead of in the middle of a release.
      - name: Check ffmpeg build is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg.sh --check
