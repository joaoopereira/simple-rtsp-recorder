name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run pack
      
      - name: Create release archive
        run: |
          cd dist
          Compress-Archive -Path * -DestinationPath ../simple-rtsp-recorder-win-x64.zip
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: simple-rtsp-recorder-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
