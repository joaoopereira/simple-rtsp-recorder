name: Release

# Run from GitHub (Actions → Release → Run workflow, also works from the
# GitHub mobile app) choosing patch/minor/major, or push a vX.Y.Z tag.
# Installed apps pick up the new release automatically within an hour, as
# soon as nothing is recording.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (used by recorder tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Test
        run: go test ./...

      - name: Compute version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            IFS=. read -r major minor patch <<< "${last#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "${{ inputs.bump }}" in
              major) v="v$((major + 1)).0.0" ;;
              minor) v="v${major}.$((minor + 1)).0" ;;
              *)     v="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

      # git-cliff (config: cliff.toml) writes the release notes; on a branch
      # run they are also inserted below the CHANGELOG.md header and
      # committed, and the release is tagged on that commit.
      - name: Update CHANGELOG.md
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          pip install --quiet git-cliff==2.14.2
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then range="--latest"; else range="--unreleased --tag $VERSION"; fi
          # Drop trailing blank lines.
          git cliff $range --strip all | awk 'NF { while (b-- > 0) print ""; b = 0; print; next } { b++ }' > "$NOTES"
          cat "$NOTES"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && ! grep -qF "## [${VERSION#v}]" CHANGELOG.md; then
            awk -v notes="$NOTES" '!done && /^## \[/ { while ((getline line < notes) > 0) print line; print ""; done = 1 } { print }' \
              CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md" && mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -q -m "chore(release): ${VERSION#v}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/pkg
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/simple-rtsp-recorder.exe .

      - name: Bundle ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg.sh dist/pkg

      - name: Package
        run: |
          cp dist/simple-rtsp-recorder.exe LICENSE install.ps1 dist/pkg/
          (cd dist/pkg && zip -q -r ../simple-rtsp-recorder-win-x64.zip .)
          (cd dist && sha256sum simple-rtsp-recorder.exe simple-rtsp-recorder-win-x64.zip > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.changelog.outputs.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/simple-rtsp-recorder.exe
            dist/simple-rtsp-recorder-win-x64.zip
            dist/checksums.txt
